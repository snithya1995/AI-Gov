name: AI-Governance CI

on:
  push:
    branches:
      - main
      - ci-pipeline

  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Frontend - ESLint
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ai-governance-main/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ai-governance-main/frontend
        run: npm ci

      - name: Lint frontend
        working-directory: ai-governance-main/frontend
        continue-on-error: true
        run: npm run lint

      # Python - Ruff
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Lint AI agents
        working-directory: ai-governance-main/backend/Agents
        continue-on-error: true
        run: ruff check .
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: ai-governance-main/frontend
        run: npm ci

      - name: Frontend test
        working-directory: ai-governance-main/frontend
        run: |
          echo "Frontend automated tests are not configured yet."
          echo "Test stage will be enabled when the development team adds tests."
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # Node.js dependencies
      # -------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: ai-governance-main/frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: ai-governance-main/frontend
        run: npm audit --audit-level=high

      - name: Install backend dependencies
        working-directory: ai-governance-main/backend
        run: npm ci

      - name: Audit backend dependencies
        working-directory: ai-governance-main/backend
        run: npm audit --audit-level=high

      # -------------------------
      # Python dependencies
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Scan Python dependencies
        working-directory: ai-governance-main/backend/Agents
        run: pip-audit -r requirements.txt  