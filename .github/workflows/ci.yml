name: AI-Governance CI

on:
  push:
    branches:
      - main
      - ci-pipeline

  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Frontend - ESLint
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ai-governance-main/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ai-governance-main/frontend
        continue-on-error: True
        run: npm ci

      - name: Lint frontend
        working-directory: ai-governance-main/frontend
        continue-on-error: True
        run: npm run lint

      # Python - Ruff
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Lint AI agents
        working-directory: ai-governance-main/backend/Agents
        continue-on-error: True
        run: ruff check .
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: ai-governance-main/frontend
        run: npm ci

      - name: Frontend test
        working-directory: ai-governance-main/frontend
        run: |
          echo "Frontend automated tests are not configured yet."
          echo "Test stage will be enabled when the development team adds tests."
  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # Node.js dependencies
      # -------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: ai-governance-main/frontend
        continue-on-error: True
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: ai-governance-main/frontend
        continue-on-error: True
        run: npm audit --audit-level=high

      - name: Install backend dependencies
        working-directory: ai-governance-main/backend
        run: npm ci

      - name: Audit backend dependencies
        working-directory: ai-governance-main/backend
        run: npm audit --audit-level=high

      # -------------------------
      # Python dependencies
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Scan Python dependencies
        working-directory: ai-governance-main/backend/Agents
        continue-on-error: True
        run: pip-audit -r requirements.txt

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript,python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  build:
    name: Build
    runs-on: ubuntu-latest

    needs:
      - lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Frontend
      - name: Install frontend dependencies
        working-directory: ai-governance-main/frontend
        run: npm ci

      - name: Build frontend
        working-directory: ai-governance-main/frontend
        run: npm run build

      # Python syntax validation
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python
        working-directory: ai-governance-main/backend/Agents
        run: python -m compileall .

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - lint
      - dependency-scan
      - security-scan
      - build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build frontend image
        run: |
          docker build \
            -f ai-governance-main/frontend/Dockerfile \
            -t ai-governance-frontend:${{ github.sha }} \
            ai-governance-main/frontend

      - name: Build backend image
        run: |
          docker build \
            -f ai-governance-main/backend/Dockerfile \
            -t ai-governance-backend:${{ github.sha }} \
            ai-governance-main/backend

      - name: Build AI agent image
        run: |
          docker build \
            -f ai-governance-main/backend/Agents/Dockerfile \
            -t ai-governance-agent:${{ github.sha }} \
            ai-governance-main/backend/Agents


  push-images:
    name: Push Docker Images
    runs-on: ubuntu-latest

    needs:
      - docker-build

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker \
            us-central1-docker.pkg.dev \
            --quiet

      - name: Build and push frontend
        run: |
          IMAGE="us-central1-docker.pkg.dev/bionic-mercury-455722-g1/ai-governance/ai-governance-frontend:${{ github.sha }}"

          docker build \
            -f ai-governance-main/frontend/Dockerfile \
            -t "$IMAGE" \
            ai-governance-main/frontend

          docker push "$IMAGE"

      - name: Build and push backend
        run: |
          IMAGE="us-central1-docker.pkg.dev/bionic-mercury-455722-g1/ai-governance/ai-governance-backend:${{ github.sha }}"

          docker build \
            -f ai-governance-main/backend/Dockerfile \
            -t "$IMAGE" \
            ai-governance-main/backend

          docker push "$IMAGE"

      - name: Build and push agent
        run: |
          IMAGE="us-central1-docker.pkg.dev/bionic-mercury-455722-g1/ai-governance/ai-governance-agent:${{ github.sha }}"

          docker build \
            -f ai-governance-main/backend/Agents/Dockerfile \
            -t "$IMAGE" \
            ai-governance-main/backend/Agents

          docker push "$IMAGE"