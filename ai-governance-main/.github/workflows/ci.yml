name: AI-Governance CI

on:
  push:
    branches:
      - main
      - ci-pipeline

  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:

  # ==================================================
  # 1. LINT
  # ==================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------------
      # Frontend - ESLint
      # -------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      # -------------------------------
      # Python - Ruff
      # -------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Lint AI agents
        working-directory: backend/Agents
        run: ruff check .


  # ==================================================
  # 2. TEST
  # ==================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # Tests will be added here once the project
      # has a real test framework.
      - name: Run backend tests
        working-directory: backend
        run: |
          echo "Backend automated tests are not configured yet."
          echo "TODO: Add Jest/Vitest tests."
          exit 1


  # ==================================================
  # 3. DEPENDENCY SECURITY SCAN
  # ==================================================
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------------
      # Node dependency scan
      # -------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=high

      # -------------------------------
      # Python dependency scan
      # -------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Scan Python dependencies
        working-directory: backend/Agents
        run: pip-audit -r requirements.txt


  # ==================================================
  # 4. SOURCE CODE SECURITY SCAN
  # ==================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript,python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3


  # ==================================================
  # 5. BUILD
  # ==================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - test
      - dependency-scan
      - security-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------------
      # Frontend build
      # -------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # -------------------------------
      # Backend dependency installation
      # -------------------------------
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # -------------------------------
      # Python validation
      # -------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python code
        working-directory: backend/Agents
        run: python -m compileall .